name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: gradle
      - name: Formatting
        run: ./gradlew spotlessCheck
      - name: Compile with lint and Error Prone, then test on embedded Postgres
        run: ./gradlew test compileBenchJava
      - name: Mutant patches still apply to this source
        run: python3 scripts/prove_mutants.py --check-patches
