# Bounded heap, and no daemon left behind after a build: test runs start a real
# Postgres, so an idle Gradle JVM on top of it is memory nobody asked to spend.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
