[versions]
spring-boot = "4.1.2"
springdoc = "3.2.0"
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "18.6.0"
jqwik = "1.10.2"
hdrhistogram = "2.2.2"
errorprone = "2.51.0"
google-java-format = "1.36.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-darwin-arm64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8", version.ref = "embedded-postgres-binaries" }
embedded-postgres-linux-amd64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-amd64", version.ref = "embedded-postgres-binaries" }
embedded-postgres-linux-arm64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8", version.ref = "embedded-postgres-binaries" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
